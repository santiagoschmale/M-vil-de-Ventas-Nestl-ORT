# Migraciones de la base del movil. La URL sale de DATABASE_URL (ver migrations/env.py).
# Sin tildes: alembic lee este archivo con el idioma del sistema, y la imagen de Docker no tiene ninguno (ASCII).
#   cd backend && DATABASE_URL=postgresql://motor:motor@localhost:5432/motor_distribucion .venv/bin/alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
