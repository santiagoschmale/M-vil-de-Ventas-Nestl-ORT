# Checks de cada PR en el repo del equipo. Provisorio: ci.yaml (el del template)
# llama al pipeline de la plataforma de Nestlé, que solo corre dentro de su
# organización. Cuando migremos, ese pasa a ser el oficial y este se borra.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # la de la imagen del template
      # Sin acceso al índice privado: todo menos las nbra-*, con sus reemplazos locales.
      - run: make deps-local
      - run: make test

  frontend:
    name: Frontend (tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # .npmrc apunta al registro privado de Nestlé; acá se usa el público.
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage.enabled=false
      - run: npx vite build
