services:
  db:
    image: postgres:16-alpine
    container_name: motor-distribucion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: motor
      POSTGRES_PASSWORD: motor
      POSTGRES_DB: motor_distribucion
    ports:
      - "5432:5432"
    volumes:
      - motor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor -d motor_distribucion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  motor_db_data:
